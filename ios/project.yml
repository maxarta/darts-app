name: DartsScore
options:
  bundleIdPrefix: app.artdart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: DartsScore/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: app.artdart.score
    DEVELOPMENT_TEAM: "" # set in Xcode
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  DartsScore:
    type: application
    platform: iOS
    sources:
      - path: DartsScore
        excludes:
          - "**/*.md"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: DartsScore/Info.plist
      properties:
        CFBundleDisplayName: Darts Score
        NSCameraUsageDescription: Камера и LiDAR нужны для автоскоринга на мишени.
        UIRequiredDeviceCapabilities:
          - arkit
        UIBackgroundModes: []
